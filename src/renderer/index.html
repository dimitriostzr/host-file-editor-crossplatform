<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hostserrer</title>
    <script>
      // Paint the right scheme before first render. The persisted preference arrives with the
      // first snapshot and takes over from there; this only prevents a flash of the wrong theme.
      document.documentElement.setAttribute(
        'data-theme',
        matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
      )
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
