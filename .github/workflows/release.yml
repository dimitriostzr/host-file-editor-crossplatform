# Builds installers for macOS, Windows and Linux in the cloud and attaches them to a GitHub
# release. Optional: releases can also be built locally (see the README). Run it by hand from
# the Actions tab, or:
#
#   gh workflow run release -f tag=v0.1.1
#
# The tag must match the version in package.json. An existing release (a draft, say) gets the
# files added or replaced; otherwise a draft release is created for you to publish.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, matching package.json (e.g. v0.1.1)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win --x64
          - os: windows-latest
            args: --win --arm64
          - os: ubuntu-latest
            args: --linux --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          v="$(node -p "require('./package.json').version")"
          test "v$v" = "$TAG" || { echo "tag $TAG != package.json v$v"; exit 1; }

      - run: npm ci

      - run: npm run check

      - run: npx electron-vite build

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No certificate: stop electron-builder looking for one in the runner's keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ strategy.job-index }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS-ci.txt

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --target "$GITHUB_SHA" \
              --title "hostserrer ${TAG#v}" --notes-file .github/release-notes.md
          fi
